name: DNS check (temporary)
on:
  push:
    paths: ['.github/workflows/dns-check.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for t in A AAAA CAA NS; do echo "== dealsaid.org $t"; dig +short dealsaid.org $t @8.8.8.8; done
          for t in A CNAME; do echo "== www.dealsaid.org $t"; dig +short www.dealsaid.org $t @8.8.8.8; done
          echo "== _github-pages-challenge TXT"; dig +short _github-pages-challenge-Robotril.dealsaid.org TXT @8.8.8.8
          echo "== HTTP"; curl -sI -m 20 http://dealsaid.org | head -5 || true
          echo "== HTTPS cert"; echo | openssl s_client -connect dealsaid.org:443 -servername dealsaid.org 2>/dev/null | openssl x509 -noout -subject -issuer -dates || true
          echo "== HTTPS"; curl -sI -m 20 https://dealsaid.org | head -5 || echo "https failed"
          echo "== github.io"; curl -sI -m 20 https://robotril.github.io/deansbluehole.dealsaid/ | head -5 || true
